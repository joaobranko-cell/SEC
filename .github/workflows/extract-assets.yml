name: Extract property assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check asset archive
        id: archive
        run: |
          if [ -f "quinta-dos-espadeiros-assets.zip" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract assets
        if: steps.archive.outputs.exists == 'true'
        run: |
          rm -rf /tmp/espadeiros-assets
          mkdir -p /tmp/espadeiros-assets
          unzip -o "quinta-dos-espadeiros-assets.zip" -d /tmp/espadeiros-assets
          rm -rf photos
          rm -f agua-em-movimento.mp4
          cp -R /tmp/espadeiros-assets/photos .
          cp /tmp/espadeiros-assets/agua-em-movimento.mp4 .

      - name: Commit extracted assets
        if: steps.archive.outputs.exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos agua-em-movimento.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Add Quinta dos Espadeiros photos and video"
          git push
